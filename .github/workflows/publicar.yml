name: Publicar o site

on:
  push:
    branches: [main]
    # cliente.json e o logo passam antes por "Aplicar configurações", que grava e dispara esta publicação
    paths-ignore: ["cliente.json", "marca/**", "controle.json", "historico/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar a Cloudflare (projeto, usuários e segredos; só cria o que falta)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: |
          tools/cloudflare_preparar.sh
          if [ -f wrangler.toml ] && [ -n "$(git status --porcelain wrangler.toml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml && git commit -qm "Cloudflare preparada" && git push -q origin HEAD:main
          fi
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
        run: tools/publicar.sh
