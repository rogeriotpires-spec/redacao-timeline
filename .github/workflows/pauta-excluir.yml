name: Excluir item da pauta

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Item a excluir (JSON)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  excluir:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: America/Sao_Paulo
      PAYLOAD: ${{ inputs.payload }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Marcar o início
        run: echo "INICIO=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        run: python3 tools/esperar.py programa.yml programa-avulso.yml pauta-excluir.yml pauta-ordem.yml
      - name: Excluir e publicar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if ! OUT=$(python3 tools/pauta_excluir.py 2>&1); then echo "::error::$OUT"; exit 1; fi
            git add programa/
            git diff --cached --quiet && exit 0
            git commit -qm "Item excluído da pauta" && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
      - name: Registrar consumo (custo, tokens e o que foi gerado)
        if: always()
        env:
          GHT: ${{ github.token }}
          USUARIO: ${{ inputs.usuario }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GHT}@github.com/${{ github.repository }}.git"
          F="${{ steps.claude.outputs.execution_file }}"; rm -f /tmp/exec.json; [ -n "$F" ] && [ -f "$F" ] && cp "$F" /tmp/exec.json || true
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/controle.py registrar excluir "${{ github.event_name }}" "$USUARIO" "$INICIO" "${{ job.status }}" 
            git add historico/consumo.json; git diff --cached --quiet && break
            git commit -qm "Consumo: excluir" && git push -q origin HEAD:main && break
            sleep $((i*3))
          done
      - name: PDF e publicação
        if: always()
        env:
          GHT: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
        run: tools/pdf_e_publicar.sh
