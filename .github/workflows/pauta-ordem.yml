name: Reordenar itens da pauta

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Nova ordem (JSON: data, ordem)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  ordenar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: America/Sao_Paulo
      PAYLOAD: ${{ inputs.payload }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        run: python3 tools/esperar.py programa.yml programa-avulso.yml pauta-excluir.yml pauta-ordem.yml
      - name: Reordenar e publicar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if ! OUT=$(python3 tools/pauta_ordem.py 2>&1); then echo "::error::$OUT"; exit 1; fi
            git add programa/
            git diff --cached --quiet && exit 0
            git commit -qm "Pauta reordenada" && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
      - name: PDF e publicação
        if: always()
        env:
          GHT: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PROJECT }}
        run: tools/pdf_e_publicar.sh
